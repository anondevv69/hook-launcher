[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
# Versions pinned to the installed Agave SDK's solana-program major (same as
# the TH hook program and the Meteora-proof test hook).
solana-program = "2"
spl-tlv-account-resolution = "0.9"
spl-transfer-hook-interface = "0.9"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
